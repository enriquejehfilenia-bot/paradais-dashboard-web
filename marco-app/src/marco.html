<section id="proj" aria-label="Proyectos guardados">
  <div class="wrap">
    <div class="sheethead"><h2>Proyectos</h2><button id="bProjClose" style="min-width:90px">Cerrar</button></div>
    <div class="toolbar">
      <button id="bNew" class="primary">Nuevo proyecto</button>
      <button id="bImport">Importar archivo</button>
      <button id="bExportAll">Exportar todos</button>
      <button id="bInstall" hidden>Instalar app</button>
      <button id="bShareApp" hidden>Compartir app</button>
    </div>
    <input id="fImport" type="file" accept=".json,application/json" hidden>
    <div id="plist"></div>
    <p class="foot" id="pfoot">Los proyectos se guardan en este dispositivo. Para pasarlos a otro dispositivo, usa Exportar e Importar.</p>
  </div>
</section>
<button id="salirCli" type="button">Salir del modo cliente</button>
